
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adult Income Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Adult Income Prediction</h1>
            <p>Enter the details below to predict the income category.</p>
        </div>

        <div class="form-card">
            <h2>Personal and Employment Details</h2>

            <form action="/predict" method="POST">
                <div class="form-grid">
                    <div class="field">
                        <label>Age</label>
                        <input type="number" name="age" min="17" max="100" required>
                    </div>

                    <div class="field">
                        <label>Workclass</label>
                        <select name="workclass" required>
                            <option value="Private">Private</option>
                            <option value="Self-emp-not-inc">Self-employed (not incorporated)</option>
                            <option value="Self-emp-inc">Self-employed (incorporated)</option>
                            <option value="Federal-gov">Federal government</option>
                            <option value="Local-gov">Local government</option>
                            <option value="State-gov">State government</option>
                            <option value="Without-pay">Without pay</option>
                            <option value="Never-worked">Never worked</option>
                            <option value="Unknown">Unknown</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Final Weight (fnlwgt)</label>
                        <input type="number" name="fnlwgt" min="1" required>
                    </div>

                    <div class="field">
                        <label>Education</label>
                        <select name="education" required>
                            <option value="Bachelors">Bachelors</option>
                            <option value="HS-grad">HS-grad</option>
                            <option value="Some-college">Some-college</option>
                            <option value="11th">11th</option>
                            <option value="12th">12th</option>
                            <option value="Assoc-acdm">Assoc-acdm</option>
                            <option value="Assoc-voc">Assoc-voc</option>
                            <option value="Masters">Masters</option>
                            <option value="Doctorate">Doctorate</option>
                            <option value="Prof-school">Prof-school</option>
                            <option value="9th">9th</option>
                            <option value="10th">10th</option>
                            <option value="7th-8th">7th-8th</option>
                            <option value="5th-6th">5th-6th</option>
                            <option value="1st-4th">1st-4th</option>
                            <option value="Preschool">Preschool</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Education Number</label>
                        <input type="number" name="education_num" min="1" max="16" required>
                    </div>

                    <div class="field">
                        <label>Marital Status</label>
                        <select name="marital_status" required>
                            <option value="Never-married">Never married</option>
                            <option value="Married-civ-spouse">Married civilian spouse</option>
                            <option value="Divorced">Divorced</option>
                            <option value="Separated">Separated</option>
                            <option value="Widowed">Widowed</option>
                            <option value="Married-spouse-absent">Married spouse absent</option>
                            <option value="Married-AF-spouse">Married AF spouse</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Occupation</label>
                        <select name="occupation" required>
                            <option value="Prof-specialty">Professional specialty</option>
                            <option value="Craft-repair">Craft repair</option>
                            <option value="Exec-managerial">Executive managerial</option>
                            <option value="Adm-clerical">Administrative clerical</option>
                            <option value="Sales">Sales</option>
                            <option value="Other-service">Other service</option>
                            <option value="Machine-op-inspct">Machine operator inspector</option>
                            <option value="Transport-moving">Transport moving</option>
                            <option value="Handlers-cleaners">Handlers cleaners</option>
                            <option value="Farming-fishing">Farming fishing</option>
                            <option value="Tech-support">Tech support</option>
                            <option value="Protective-serv">Protective service</option>
                            <option value="Priv-house-serv">Private household service</option>
                            <option value="Armed-Forces">Armed forces</option>
                            <option value="Unknown">Unknown</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Relationship</label>
                        <select name="relationship" required>
                            <option value="Husband">Husband</option>
                            <option value="Wife">Wife</option>
                            <option value="Own-child">Own child</option>
                            <option value="Unmarried">Unmarried</option>
                            <option value="Not-in-family">Not in family</option>
                            <option value="Other-relative">Other relative</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Race</label>
                        <select name="race" required>
                            <option value="White">White</option>
                            <option value="Black">Black</option>
                            <option value="Asian-Pac-Islander">Asian Pacific Islander</option>
                            <option value="Amer-Indian-Eskimo">American Indian Eskimo</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Sex</label>
                        <select name="sex" required>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Capital Gain</label>
                        <input type="number" name="capital_gain" min="0" value="0" required>
                    </div>

                    <div class="field">
                        <label>Capital Loss</label>
                        <input type="number" name="capital_loss" min="0" value="0" required>
                    </div>

                    <div class="field">
                        <label>Hours per Week</label>
                        <input type="number" name="hours_per_week" min="1" max="168" required>
                    </div>

                    <div class="field">
                        <label>Native Country</label>
                        <select name="native_country" required>
                            <option value="United-States">United States</option>
                            <option value="Mexico">Mexico</option>
                            <option value="India">India</option>
                            <option value="Canada">Canada</option>
                            <option value="England">England</option>
                            <option value="Germany">Germany</option>
                            <option value="Philippines">Philippines</option>
                            <option value="Other">Other</option>
                            <option value="Unknown">Unknown</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="predict-btn">Predict Income</button>
            </form>

            {% if prediction is defined %}
                <div class="result">
                    <h2>Prediction Result</h2>
                    <p>Predicted income category: <strong>{{ prediction }}</strong></p>
                </div>
            {% endif %}
        </div>

        <div class="footer">
            Adult Income Prediction | Machine Learning Project
        </div>
    </div>
</body>
</html>
